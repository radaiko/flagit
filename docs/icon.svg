<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1d24"/>
      <stop offset="100%" stop-color="#0d0f13"/>
    </linearGradient>
    <linearGradient id="bugGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6a33"/>
      <stop offset="100%" stop-color="#e04a10"/>
    </linearGradient>
    <linearGradient id="featureGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5aa0f5"/>
      <stop offset="100%" stop-color="#2f80ed"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect width="1024" height="1024" rx="220" fill="none" stroke="#2c3037" stroke-width="2"/>

  <!-- Bug circle — orange, large, left side -->
  <circle cx="410" cy="512" r="210" fill="url(#bugGrad)"/>

  <!-- Stylized bug inside the orange circle -->
  <!-- Bug body (oval, tilted slightly) -->
  <ellipse cx="410" cy="520" rx="70" ry="55" fill="#ffffff" opacity="0.95"/>
  <!-- Bug head -->
  <circle cx="460" cy="500" r="28" fill="#ffffff" opacity="0.95"/>
  <!-- Wing split line -->
  <path d="M410 465 Q420 520 410 575" stroke="#e04a10" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Bug spots -->
  <circle cx="385" cy="500" r="9" fill="#e04a10"/>
  <circle cx="440" cy="510" r="8" fill="#e04a10"/>
  <circle cx="390" cy="540" r="7" fill="#e04a10"/>
  <circle cx="435" cy="545" r="7" fill="#e04a10"/>
  <!-- Antennae -->
  <path d="M475 485 Q495 460 505 450" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M475 485 Q500 470 515 470" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Legs -->
  <line x1="355" y1="510" x2="330" y2="500" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="355" y1="525" x2="330" y2="530" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="355" y1="540" x2="335" y2="555" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- Feature circle — blue, smaller, overlapping right -->
  <circle cx="640" cy="440" r="170" fill="url(#featureGrad)"/>

  <!-- Plus sign inside blue circle -->
  <line x1="595" y1="440" x2="685" y2="440" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  <line x1="640" y1="395" x2="640" y2="485" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>

  <!-- Subtle overlap shadow between circles -->
  <ellipse cx="540" cy="480" rx="30" ry="15" fill="#0d0f13" opacity="0.3"/>
</svg>
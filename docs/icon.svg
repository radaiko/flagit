<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1d24"/>
      <stop offset="100%" stop-color="#0d0f13"/>
    </linearGradient>
    <linearGradient id="flag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6a33"/>
      <stop offset="100%" stop-color="#e04a10"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4e1da"/>
      <stop offset="100%" stop-color="#b6bac2"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Subtle inner glow -->
  <rect width="1024" height="1024" rx="220" fill="none" stroke="#2c3037" stroke-width="2"/>

  <!-- Flag pole -->
  <rect x="494" y="160" width="36" height="640" rx="18" fill="url(#pole)"/>

  <!-- Flag marker — triangular flag waving right -->
  <path d="M530 180 C580 180 600 240 660 260 C600 280 580 340 530 340 L530 180Z" fill="url(#flag)"/>

  <!-- Flag marker — second fold (depth) -->
  <path d="M530 260 C560 260 580 290 620 300 C580 310 560 340 530 340 Z" fill="#c43d08" opacity="0.4"/>

  <!-- Flag pole base / ground marker -->
  <ellipse cx="512" cy="820" rx="120" ry="18" fill="#ff5a1f" opacity="0.15"/>
  <ellipse cx="512" cy="820" rx="80" ry="10" fill="#ff5a1f" opacity="0.25"/>

  <!-- Checkmark on the flag -->
  <path d="M560 250 L580 280 L630 220" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Subtle highlight on pole -->
  <rect x="502" y="160" width="8" height="640" rx="4" fill="#ffffff" opacity="0.1"/>
</svg>
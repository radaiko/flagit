# Flagit — Coolify-compatible Docker Compose deployment.
#
# Two audiences, two very different paths in:
#
#   flagit:8080  public API and web overlay. Not published to the host: Coolify's
#                proxy reaches it over the compose network and terminates TLS for
#                https://flagit.spitzbub.app.
#   flagit:3000  internal API and admin dashboard. Not published to the host and
#                never given a Coolify domain. The only way in is the Tailscale
#                sidecar below, which serves it at flagit-admin.<tailnet>.ts.net.
#
# Nothing here binds a host port, so the VM firewall stays closed and the admin
# dashboard cannot be reached from the internet even by accident. To publish the
# dashboard on loopback for local work, add docker-compose.local.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d flagit
services:
  flagit:
    build:
      context: .
      args:
        # Both optional, and both only the fast path: when neither reaches the
        # build the image resolves the revision from the .git metadata of the
        # checkout it is built from (see the provenance stage in Dockerfile).
        # That fallback is what makes this work on Coolify's raw Compose build
        # pack, which does not hand SOURCE_COMMIT to builds.
        GIT_COMMIT: ${GIT_COMMIT:-}
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    restart: unless-stopped

    # `expose`, not `ports`: reachable from the compose network (Coolify's proxy,
    # the Tailscale sidecar) but never bound to a host interface.
    #
    # Only 8080 is listed, and deliberately: `expose` is what Coolify's Traefik
    # reads when it decides which container port the domain resolves to, and a
    # second candidate is how the admin listener ends up answering the public
    # domain. It changes nothing for the Tailscale sidecar — `expose` gates
    # nothing on a compose network, so the sidecar still reaches flagit:3000.
    expose:
      - "8080"

    # Say it outright as well, so the routing does not depend on Traefik
    # inferring the port from `expose`. The service name is Coolify's generated
    # one for this deployment; it has to match or the label is ignored.
    labels:
      traefik.http.services.https-0-rax61448voi481y8nirryfa2-flagit.loadbalancer.server.port: "8080"

    volumes:
      # SQLite lives here. Mount this as a persistent volume in Coolify or every
      # redeploy starts from an empty database.
      - flagit_data:/data

    environment:
      # Externally reachable base URL, used to build the ticket link in the
      # Hermes webhook payload. Must match the domain Coolify routes to 8080.
      FLAGIT_PUBLIC_URL: ${FLAGIT_PUBLIC_URL:-https://flagit.spitzbub.app}
      # Required secret — set it in Coolify, never in a file in this repository.
      # Left empty, Flagit falls back to its old behaviour: it generates a key
      # and prints it once to the container log.
      FLAGIT_ADMIN_KEY: ${FLAGIT_ADMIN_KEY}
      # Stand the admin key down on port 3000 only. That listener is published
      # to nothing and has no domain, so the only way to it is the Tailscale
      # sidecar below and the tailnet has already authenticated whoever
      # arrives — a second credential the sidecar cannot present would just
      # lock the dashboard shut. The public API on 8080 is untouched by this
      # and still requires its own credentials. Set it to false to put the key
      # back, and do so before publishing 3000 anywhere.
      FLAGIT_ADMIN_DISABLE_AUTH: "${FLAGIT_ADMIN_DISABLE_AUTH:-true}"
      # Git revision this deployment is running, shown in the admin dashboard
      # header so an operator can confirm what actually landed. Optional, and
      # deliberately so: it only overrides the revision already baked into the
      # image at build time. Set FLAGIT_COMMIT by hand to pin the value;
      # otherwise SOURCE_COMMIT is used when the platform interpolates it here,
      # and an empty value simply leaves the image's own answer standing.
      # Only a hex object name is accepted. Anything else — most likely a
      # variable the platform never substituted — is refused at startup with a
      # warning in the container log, and the image's own revision stands.
      FLAGIT_COMMIT: ${FLAGIT_COMMIT:-${SOURCE_COMMIT:-}}

  # Tailscale node dedicated to the admin dashboard. It is a separate identity
  # from any tailscale running on the host, so revoking it takes the dashboard
  # offline without touching anything else on the tailnet.
  tailscale-admin:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    hostname: flagit-admin

    environment:
      # Required secret — a Tailscale auth key, set in Coolify. Tag it (for
      # example tag:flagit-admin) so the node does not inherit key expiry.
      TS_AUTHKEY: ${TS_AUTHKEY}
      # Node name on the tailnet: flagit-admin.<tailnet>.ts.net.
      TS_HOSTNAME: flagit-admin
      TS_STATE_DIR: /var/lib/tailscale
      # Mounted as a directory, not a file, so tailscaled notices edits to it.
      TS_SERVE_CONFIG: /config/serve.json
      # Userspace networking: proxying inbound traffic needs no /dev/net/tun and
      # no NET_ADMIN capability, which keeps the sidecar unprivileged.
      TS_USERSPACE: "true"
      # Keep Docker's embedded resolver in place — MagicDNS would replace it and
      # the serve target below resolves the compose service name "flagit".
      TS_ACCEPT_DNS: "false"

    volumes:
      # Node identity. Without it every restart burns a new device on the tailnet.
      - tailscale_state:/var/lib/tailscale
      - ./deploy/tailscale:/config:ro

    depends_on:
      flagit:
        condition: service_healthy

volumes:
  flagit_data:
  tailscale_state:

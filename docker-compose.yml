services:
  flagit:
    build: .
    image: flagit
    container_name: flagit
    restart: unless-stopped

    ports:
      # Public API and web overlay — this is the one apps talk to.
      - "8080:8080"
      # Internal API and admin dashboard. Bound to loopback so it is never
      # reachable from the internet by default: reach it over an SSH tunnel, or
      # bind it to this host's Tailscale address instead ("100.x.y.z:3000:3000")
      # to expose it to your tailnet only.
      - "127.0.0.1:3000:3000"

    volumes:
      - flagit_data:/data

    environment:
      # Externally reachable base URL. Used to build the ticket link in the
      # Hermes webhook payload.
      FLAGIT_PUBLIC_URL: ${FLAGIT_PUBLIC_URL:-}
      # Leave unset on first run: Flagit generates a key and prints it once to
      # the container log (`docker compose logs flagit`).
      FLAGIT_ADMIN_KEY: ${FLAGIT_ADMIN_KEY:-}

volumes:
  flagit_data:
